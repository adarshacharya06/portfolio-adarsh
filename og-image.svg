<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#141E10" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#08090A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#050607" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8FF00"/>
      <stop offset="100%" stop-color="#8CE000"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGlow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Outer Technical Border Frame -->
  <rect x="30" y="30" width="1140" height="570" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
  <rect x="30" y="30" width="1140" height="570" rx="16" fill="none" stroke="url(#limeGrad)" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Corner Accents -->
  <path d="M 30 60 L 30 30 L 60 30" fill="none" stroke="#B8FF00" stroke-width="3"/>
  <path d="M 1140 30 L 1170 30 L 1170 60" fill="none" stroke="#B8FF00" stroke-width="3"/>
  <path d="M 30 570 L 30 600 L 60 600" fill="none" stroke="#B8FF00" stroke-width="3"/>
  <path d="M 1140 600 L 1170 600 L 1170 570" fill="none" stroke="#B8FF00" stroke-width="3"/>

  <!-- Top System Telemetry Bar -->
  <g transform="translate(70, 75)">
    <!-- Status Dot & Pill -->
    <rect x="0" y="0" width="280" height="32" rx="6" fill="#0F1318" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <circle cx="18" cy="16" r="4" fill="#B8FF00"/>
    <text x="32" y="21" font-family="'Courier New', monospace" font-size="12" font-weight="600" fill="#E2E8F0" letter-spacing="1.5">BUILDING • LEARNING • EXPLORING</text>
    
    <text x="310" y="21" font-family="'Courier New', monospace" font-size="12" fill="#64748B" letter-spacing="1">// SYSTEM TOPOLOGY ACTIVE</text>
    <text x="960" y="21" font-family="'Courier New', monospace" font-size="12" font-weight="600" fill="#B8FF00" text-anchor="end" letter-spacing="1">PORTFOLIO 2026</text>
  </g>

  <!-- Left Main Content -->
  <g transform="translate(70, 165)">
    <!-- Small Category Label -->
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="#B8FF00" letter-spacing="2">CLOUD &amp; INFRASTRUCTURE ENGINEER</text>

    <!-- Main Large Name -->
    <text x="0" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="900" fill="url(#textGrad)" letter-spacing="-1.5">ADARSH</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#94A3B8">
      Engineering what's next at the intersection of
    </text>
    <text x="0" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#F1F5F9">
      cloud infrastructure, automation, and modern software development.
    </text>

    <!-- Experience Credentials Pills -->
    <g transform="translate(0, 215)">
      <!-- LTM Pill -->
      <rect x="0" y="0" width="220" height="42" rx="8" fill="#12170F" stroke="#B8FF00" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="16" cy="21" r="3.5" fill="#B8FF00"/>
      <text x="30" y="26" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#FFFFFF">LTM (LTIMINDTREE)</text>

      <!-- IIT Madras Pill -->
      <rect x="235" y="0" width="220" height="42" rx="8" fill="#0C151B" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.5"/>
      <circle cx="251" cy="21" r="3.5" fill="#38BDF8"/>
      <text x="265" y="26" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#FFFFFF">IIT MADRAS ALUMNI</text>

      <!-- Location Pill -->
      <rect x="470" y="0" width="220" height="42" rx="8" fill="#0F1216" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <text x="488" y="26" font-family="'Courier New', monospace" font-size="12" font-weight="600" fill="#CBD5E1">📍 KORAMANGALA, BLR</text>
    </g>
  </g>

  <!-- Right Side: Graphic Technical Constellation Diagram -->
  <g transform="translate(830, 200)">
    <!-- Central Node -->
    <circle cx="150" cy="140" r="46" fill="#111812" stroke="#B8FF00" stroke-width="2.5"/>
    <circle cx="150" cy="140" r="36" fill="#152414" stroke="#B8FF00" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="150" y="145" font-family="'Courier New', monospace" font-size="13" font-weight="800" fill="#B8FF00" text-anchor="middle">LTM CORE</text>

    <!-- Satellite Nodes -->
    <!-- Azure -->
    <line x1="150" y1="140" x2="60" y2="40" stroke="rgba(184, 255, 0, 0.4)" stroke-width="1.5"/>
    <circle cx="60" cy="40" r="26" fill="#0F1318" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="60" y="44" font-family="'Courier New', monospace" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">AZURE</text>

    <!-- Active Directory -->
    <line x1="150" y1="140" x2="250" y2="50" stroke="rgba(184, 255, 0, 0.4)" stroke-width="1.5"/>
    <circle cx="250" cy="50" r="28" fill="#0F1318" stroke="#B8FF00" stroke-width="1.5"/>
    <text x="250" y="54" font-family="'Courier New', monospace" font-size="10" font-weight="700" fill="#B8FF00" text-anchor="middle">ACTIVE DIR</text>

    <!-- PowerShell -->
    <line x1="150" y1="140" x2="270" y2="190" stroke="rgba(184, 255, 0, 0.4)" stroke-width="1.5"/>
    <circle cx="270" cy="190" r="24" fill="#0F1318" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.5"/>
    <text x="270" y="194" font-family="'Courier New', monospace" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">POWERSHELL</text>

    <!-- Networks -->
    <line x1="150" y1="140" x2="150" y2="250" stroke="rgba(184, 255, 0, 0.4)" stroke-width="1.5"/>
    <circle cx="150" cy="250" r="24" fill="#0F1318" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="150" y="254" font-family="'Courier New', monospace" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">NETWORKS</text>

    <!-- DevOps -->
    <line x1="150" y1="140" x2="40" y2="180" stroke="rgba(184, 255, 0, 0.4)" stroke-width="1.5"/>
    <circle cx="40" cy="180" r="24" fill="#0F1318" stroke="#B8FF00" stroke-width="1.5"/>
    <text x="40" y="184" font-family="'Courier New', monospace" font-size="9" font-weight="700" fill="#B8FF00" text-anchor="middle">DEVOPS</text>
  </g>

  <!-- Bottom Technical Strip -->
  <g transform="translate(70, 545)">
    <line x1="0" y1="0" x2="1060" y2="0" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <text x="0" y="28" font-family="'Courier New', monospace" font-size="12" fill="#64748B">LATENCY: 12ms // COORD: 12.9352° N, 77.6245° E (KORAMANGALA, BLR)</text>
    <text x="1060" y="28" font-family="'Courier New', monospace" font-size="12" font-weight="600" fill="#CBD5E1" text-anchor="end">ADARSH.TECH // DESIGNED WITH CURIOSITY</text>
  </g>
</svg>